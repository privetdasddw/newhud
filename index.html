<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Reference HUD</title>
<style>
/* Единственный подключённый интерфейс ресурса. Старые CSS/JS не загружаются.
   Система координат эталона: 1568 x 981. Размеры масштабируются равномерно,
   привязки к краям остаются процентными. Arial выбран визуально по снимку.
   Никаких CDN, фоновых изображений, NUI focus или внешних библиотек. */
:root {
  --scale: 1;
  --text: rgb(246, 246, 247);
  --secondary: rgb(218, 218, 219);
  --inactive: rgb(86, 86, 87);
  --surface: rgba(29, 30, 30, .82);
  --edge: rgba(189, 190, 191, .23);
  --track: rgba(126, 127, 128, .34);
}
/* RGB выше служит fallback для старых сборок CEF. */
@supports (color: oklch(50% .005 250)) {
  :root {
    --text: oklch(97.4% .001 250);
    --secondary: oklch(88.7% .001 250);
    --inactive: oklch(45.3% .001 250);
    --surface: oklch(23.4% .002 180 / .82);
    --edge: oklch(80% .002 250 / .23);
    --track: oklch(59.7% .002 250 / .34);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
body { font-family: Arial, Helvetica, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; user-select: none; }
#hud { position: fixed; inset: 0; pointer-events: none; font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
.surface {
  position: absolute;
  background: var(--surface);
  border: 1.5px solid var(--edge);
  box-shadow: 0 2px 12px rgba(15, 16, 17, .12), inset 0 0 20px rgba(220, 221, 222, .015);
  /* backdrop-filter намеренно отсутствует: CEF не размывает игровой мир
     как обычный DOM-фон. Сохраняем прозрачность без чёрного прямоугольника. */
}
.address {
  left: 4.017857%; top: 9.480122%; width: 597px; height: 80px;
  border-radius: 42px; transform: scale(var(--scale)); transform-origin: top left;
  display: flex; align-items: center; padding: 0 20px 0 32px;
}
.icon { display: block; flex: none; }
.icon svg { display: block; width: 100%; height: 100%; }
.pin { width: 28px; height: 34px; }
.postal { margin-left: 22px; font-size: 28px; line-height: 34px; letter-spacing: .5px; flex: none; }
.address-divider { flex: none; width: 1.5px; height: 31px; background: rgba(237, 237, 238, .85); margin: 0 29px; }
.street { min-width: 0; flex: 1; font-size: 27px; font-weight: 600; line-height: 34px; letter-spacing: .35px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.compass { flex: none; width: 46px; height: 46px; margin-left: 22px; border: 2.5px solid rgba(160, 161, 162, .20); border-radius: 50%; display: grid; place-items: center; font-size: 27px; font-weight: 600; }
.weather {
  right: 4.272959%; top: 36.187564%; width: 206px; height: 74px;
  border-radius: 40px; transform: scale(var(--scale)); transform-origin: top right;
  display: flex; align-items: center; justify-content: center; gap: 26px;
}
.weather-icon { width: 37px; height: 37px; }
.temperature { font-size: 28px; line-height: 34px; white-space: nowrap; }
.cluster {
  right: 4.910714%; bottom: 10.805301%; width: 400px; height: 315px;
  border-radius: 42px; transform: scale(var(--scale)); transform-origin: bottom right;
}
.speed-row { position: absolute; left: 37px; right: 35px; top: 18px; height: 112px; display: flex; align-items: baseline; gap: 27px; }
.speed { font-size: 104px; font-weight: 700; line-height: 112px; letter-spacing: -3px; white-space: nowrap; }
.speed.wide { font-size: 77px; letter-spacing: -2px; }
.unit { font-size: 27px; line-height: 32px; color: var(--secondary); }
.cluster-divider { position: absolute; left: 38px; right: 34px; top: 138px; height: 2px; background: rgba(150, 151, 152, .19); }
.gears { position: absolute; left: 39px; top: 164px; display: flex; align-items: center; gap: 19px; height: 41px; }
.gears span { color: var(--inactive); font-size: 36px; font-weight: 600; line-height: 41px; }
.gears span.active { color: var(--text); }
.fuel-row { position: absolute; left: 38px; right: 34px; top: 241px; height: 38px; display: flex; align-items: center; }
.fuel-icon { width: 33px; height: 34px; color: rgb(161, 162, 163); margin-right: 22px; }
.fuel-track { height: 15px; flex: 1; border-radius: 10px; overflow: hidden; background: var(--track); }
.fuel-fill { width: 100%; height: 100%; border-radius: inherit; background: var(--text); transform: scaleX(0); transform-origin: left center; }
.fuel-value { width: 62px; margin-left: 23px; font-size: 30px; line-height: 36px; text-align: right; color: var(--secondary); white-space: nowrap; }
/* Только браузерный просмотр. В FiveM body всегда прозрачен. */
body.preview { background: rgb(60, 64, 65); background: oklch(37% .008 180); }
.preview-note { position: fixed; bottom: 12px; left: 16px; margin: 0; color: rgb(197, 202, 203); font: 12px/1.5 Arial, sans-serif; pointer-events: none; }
@media (prefers-reduced-motion: no-preference) { .fuel-fill { transition: transform 160ms cubic-bezier(.22, 1, .36, 1); } }
</style>
</head>
<body>
<!-- Пустое/неизвестное состояние не подменяется демонстрационными данными. -->
<main aria-label="Игровой HUD" hidden="" id="hud">
<section aria-label="Местоположение" class="address surface">
<span aria-hidden="true" class="icon pin"><svg fill="currentColor" viewbox="0 0 28 36"><path d="M14 1C7.3 1 2 6.3 2 13c0 8.8 12 22 12 22s12-13.2 12-22C26 6.3 20.7 1 14 1Zm0 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z" fill-rule="evenodd"></path></svg></span>
<span class="postal" id="postal">----</span>
<span aria-hidden="true" class="address-divider"></span>
<span class="street" id="street">...</span>
<span aria-label="Направление" class="compass" id="compass">?</span>
</section>
<section aria-label="Погода" class="weather surface">
<span aria-hidden="true" class="icon weather-icon" id="weather-icon"></span>
<span class="temperature" id="temperature">--°</span>
</section>
<section aria-label="Приборная панель" class="cluster surface" hidden="" id="cluster">
<div class="speed-row"><span class="speed" id="speed">---</span><span class="unit" id="unit"></span></div>
<div aria-hidden="true" class="cluster-divider"></div>
<div aria-label="Режим коробки передач" class="gears" id="gears"><span data-gear="P">P</span><span data-gear="R">R</span><span data-gear="N">N</span><span data-gear="D">D</span><span data-gear="S">S</span></div>
<div class="fuel-row">
<span aria-hidden="true" class="icon fuel-icon"><svg fill="currentColor" viewbox="0 0 34 36"><path d="M3 2h15a3 3 0 0 1 3 3v27h1v2H1v-2h1V5a3 3 0 0 1 1-3Zm2 3v9h13V5H5Z" fill-rule="evenodd"></path><path d="M21 14h2c2 0 3 2 3 4v10c0 2 4 2 4 0V13l-5-7M26 5l5 4v6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path></svg></span>
<div aria-label="Топливо" aria-valuemax="100" aria-valuemin="0" class="fuel-track" id="fuel-track" role="progressbar"><div class="fuel-fill" id="fuel-fill"></div></div>
<span class="fuel-value" id="fuel">--%</span>
</div>
</section>
</main>
<script>
/* Контракт Lua сохранён: action hud (частичный diff), config, reset;
   обратный POST /uiReady. Источники скорости/передачи/топлива не меняются. */
(function () {
  'use strict';
  const IS_FIVEM = typeof GetParentResourceName === 'function';
  const $ = id => document.getElementById(id);
  const initialState = () => ({
    visible: null, drive: null, time: null, night: null, weather: null,
    temperature: null, street: null, postal: null, direction: null,
    speed: null, unit: null, gear: null, fuel: null, delta: null,
    limit: null, cruise: null, seatbelt: null, mic: null,
    radioChannel: null, radioTalking: null, lowFuel: 15
  });
  const state = initialState();
  window.HUDState = state;
  const cloud = '<path d="M7 21a5 5 0 0 1-.6-10A7.1 7.1 0 0 1 20 8.9a4.7 4.7 0 0 1 5 4.7A3.7 3.7 0 0 1 25 21H7Z"/>';
  const weatherShapes = {
    cloud,
    sun: '<circle cx="16" cy="14" r="6"/><path d="M16 2v3m0 18v3M4 14H1m30 0h-3M5 3l3 3m16 16 3 3M5 25l3-3M24 6l3-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    rain: cloud + '<path d="m10 24-1 3m8-3-1 3m8-3-1 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    thunder: cloud + '<path d="m17 19-5 7h4l-1 5 7-8h-5l3-4Z"/>',
    snow: '<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 2v26M5 8l22 14M5 22 27 8M12 5l4 4 4-4M12 25l4-4 4 4M5 13l6-1-1-6M22 24l-1-6 6-1M5 17l6 1-1 6M22 6l-1 6 6 1"/></g>',
    fog: cloud + '<path d="M6 25h21M10 29h13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
  };
  function finite(value) {
    return typeof value === 'number' && Number.isFinite(value) ? value : null;
  }
  function text(id, value, fallback) {
    const next = value === null || value === undefined || value === '' ? fallback : String(value);
    if ($(id).textContent !== next) $(id).textContent = next;
  }
  function renderWeather() {
    const key = Object.prototype.hasOwnProperty.call(weatherShapes, state.weather) ? state.weather : 'cloud';
    const el = $('weather-icon');
    if (el.dataset.weather !== key) {
      /* Разметка только из закрытого словаря, никогда не из NUI payload. */
      el.innerHTML = '<svg viewBox="0 0 32 32" fill="currentColor">' + weatherShapes[key] + '</svg>';
      el.dataset.weather = key;
    }
  }
  function render() {
    $('hud').hidden = state.visible !== true;
    $('cluster').hidden = state.drive !== true;
    text('postal', state.postal, '----');
    text('street', state.street, '...');
    text('compass', state.direction, '?');
    text('temperature', state.temperature, '--°');
    text('unit', state.unit, '');
    renderWeather();
    const speed = finite(state.speed);
    const speedText = speed === null ? '---' : String(Math.max(0, Math.round(speed))).padStart(3, '0');
    text('speed', speedText, '---');
    $('speed').classList.toggle('wide', speedText.length > 3);
    /* Все ведущие нули белые. Передача выбирается только из данных Lua:
       UI не выдумывает P при нулевой скорости и не заменяет R на N. */
    document.querySelectorAll('[data-gear]').forEach(el => {
      const active = el.dataset.gear === state.gear;
      el.classList.toggle('active', active);
      if (active) el.setAttribute('aria-current', 'true');
      else el.removeAttribute('aria-current');
    });
    const rawFuel = finite(state.fuel);
    const fuel = rawFuel === null ? null : Math.max(0, Math.min(100, Math.round(rawFuel)));
    text('fuel', fuel === null ? null : fuel + '%', '--%');
    const transform = 'scaleX(' + (fuel === null ? 0 : fuel / 100) + ')';
    if ($('fuel-fill').style.transform !== transform) $('fuel-fill').style.transform = transform;
    if (fuel === null) $('fuel-track').removeAttribute('aria-valuenow');
    else $('fuel-track').setAttribute('aria-valuenow', String(fuel));
  }
  window.HUD = {
    init() {
      /* Сбрасываем и хранилище, и DOM: после restart нет старой скорости. */
      Object.assign(state, initialState());
      render();
    },
    apply(data) {
      if (!data || typeof data !== 'object' || Array.isArray(data)) return;
      /* Сначала объединяем весь diff, затем рисуем согласованный снимок.
         Остальные поля сохраняются, но отсутствуют на эталонном экране. */
      Object.keys(state).forEach(key => {
        if (Object.prototype.hasOwnProperty.call(data, key)) state[key] = data[key];
      });
      render();
    },
    config(data) {
      if (!data || typeof data !== 'object') return;
      if (finite(data.lowFuel) !== null) state.lowFuel = data.lowFuel;
      /* Конфигурация принята для совместимости. Accent и radar не влияют
         на монохромный эталон с независимым позиционированием панелей. */
    }
  };
  function resize() {
    const scale = Math.min(window.innerWidth / 1568, window.innerHeight / 981);
    document.documentElement.style.setProperty('--scale', String(scale));
  }
  window.addEventListener('resize', resize);
  resize();
  let generation = 0;
  let retryTimer = null;
  async function handshake(token, attempt) {
    if (!IS_FIVEM || token !== generation) return;
    try {
      const response = await fetch('https://' + GetParentResourceName() + '/uiReady', {
        method: 'POST', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body: '{}'
      });
      if (!response.ok) throw new Error('Readiness not acknowledged');
    } catch (_) {
      /* Ограниченный retry при старте ресурса, без бесконечных запросов. */
      if (token === generation && attempt < 5) {
        retryTimer = setTimeout(() => handshake(token, attempt + 1), 500 * (attempt + 1));
      }
    }
  }
  function restart() {
    clearTimeout(retryTimer);
    generation += 1;
    window.HUD.init();
    if (IS_FIVEM) handshake(generation, 0);
  }
  window.addEventListener('message', event => {
    const msg = event.data;
    if (!msg || typeof msg !== 'object' || Array.isArray(msg)) return;
    if (msg.action === 'hud') window.HUD.apply(msg);
    else if (msg.action === 'config') window.HUD.config(msg);
    else if (msg.action === 'reset') restart();
  });
  /* Скрипт находится после DOM: обработчики готовы до uiReady. */
  restart();
  if (!IS_FIVEM) {
    document.body.classList.add('preview');
    const note = document.createElement('p');
    note.className = 'preview-note';
    note.textContent = 'Предпросмотр: демонстрационные данные. ?demo для анимации, ?walk без автомобиля.';
    document.body.appendChild(note);
    const params = new URLSearchParams(location.search);
    window.HUD.apply({ visible: true, drive: !params.has('walk'), postal: '7285',
      street: 'ШОССЕ ЛОС-САНТОС', direction: 'С', weather: 'cloud',
      temperature: '70°F', speed: 0, unit: 'MPH', gear: 'P', fuel: 42 });
    /* Демо никогда не выполняется внутри FiveM и не заменяет Lua-данные. */
    if (params.has('demo')) {
      let tick = 0;
      setInterval(() => {
        tick += 1;
        const modes = ['P', 'R', 'N', 'D', 'S'];
        const gear = modes[Math.floor(tick / 10) % modes.length];
        const speed = gear === 'P' || gear === 'N' ? 0 : Math.round((Math.sin(tick / 8) + 1) * (gear === 'R' ? 5 : 42));
        window.HUD.apply({ speed, gear, fuel: Math.max(0, 42 - Math.floor(tick / 15)),
          postal: Math.floor(tick / 30) % 2 ? '7286' : '7285',
          street: Math.floor(tick / 30) % 2 ? 'ВАЙНВУД-БУЛЬВАР' : 'ШОССЕ ЛОС-САНТОС',
          direction: ['С', 'В', 'Ю', 'З'][Math.floor(tick / 20) % 4],
          weather: ['cloud', 'sun', 'rain', 'snow'][Math.floor(tick / 40) % 4],
          temperature: (70 + Math.floor(tick / 40) % 4) + '°F' });
      }, 250);
    }
  }
})();
</script>
</body>
</html>
